<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ICS 311 crib sheet (print)</title>
<style>
@page{size:11in 8.5in;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#14161c;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:"Segoe UI","Segoe UI Symbol",Arial,sans-serif;line-height:1.36}
.sheet{width:11in;height:8.5in;padding:.24in .26in .22in;display:flex;flex-direction:column;overflow:hidden;break-after:page;page-break-after:always}
.sheet:last-child{break-after:auto;page-break-after:auto}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:12pt;border-bottom:1.4pt solid var(--acc);padding-bottom:2pt;margin-bottom:4pt;flex:none}
.hd h1{font-size:11pt;margin:0;color:var(--acc2);white-space:nowrap}
.hd .sub{font-size:.95em;color:#444;flex:1}
.hd .pg{font-size:.95em;color:#666;white-space:nowrap}
.cols{flex:1;display:flex;gap:.11in;min-height:0}
.col{flex:1 1 0;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:3pt}
.pc{border:.6pt solid #c3c8d6;border-radius:3pt;padding:2pt 3.6pt 2.4pt;break-inside:avoid;page-break-inside:avoid;flex:none;overflow:hidden}
.ps{background:var(--acc);color:#fff;font-weight:700;margin:-2pt -3.6pt 2pt;padding:1.2pt 3.6pt;border-radius:2.4pt 2.4pt 0 0;font-size:1.04em}
.pt{font-weight:700;color:var(--acc2);margin:0 0 1pt}
p{margin:1pt 0}
ul,ol{margin:1pt 0;padding-left:1.05em}
li{margin:0}
li>ul,li>ol{margin:0}
b{font-weight:700}
.callout{margin:0}
table{border-collapse:collapse;width:100%;margin:1.2pt 0}
td,th{border:.4pt solid #cfd3de;padding:.3pt 1.8pt;line-height:1.22;vertical-align:top;text-align:left}
th{background:#eceef5;font-weight:700}
pre{font-family:Consolas,"Cascadia Mono","Courier New",monospace;font-size:.9em;line-height:1.16;background:#f4f5f9;border:.4pt solid #cfd3de;border-radius:2pt;padding:1.4pt 2.6pt;margin:1.4pt 0;white-space:pre;overflow:hidden}
code{font-family:Consolas,"Cascadia Mono",monospace;font-size:.93em;background:#eef0f5;padding:0 1.4pt;border-radius:1.5pt}
pre code{background:none;padding:0}
.m{font-family:Cambria,"Cambria Math","Times New Roman",serif;font-size:1em;border:.55pt solid var(--accl);background:var(--accbg);border-radius:2pt;padding:0 1.6pt;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.m sub,.m sup{font-size:.72em;line-height:0}
td .m,th .m{border:none;background:none;padding:0}
sub,sup{line-height:0}
</style></head>
<body>
<div id="root"></div>
<script>
/*__JS__*/
</script>
</body></html>
